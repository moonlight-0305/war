                        const grad = ctx.createRadialGradient(eff.x, eff.y, 0, eff.x, eff.y, eff.radius * alpha);
                        grad.addColorStop(0, 'rgba(255,255,200,0.9)');
                        grad.addColorStop(0.3, 'rgba(255,150,50,0.7)');
                        grad.addColorStop(0.7, 'rgba(255,50,20,0.3)');
                        grad.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(eff.x, eff.y, eff.radius * alpha, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (eff.type === 'lightning') {
                        ctx.strokeStyle = `rgba(255,255,100,${alpha})`;
                        ctx.lineWidth = 2 + alpha * 3;
                        ctx.beginPath();
                        ctx.moveTo(eff.x1, eff.y1);
                        const midX = (eff.x1 + eff.x2) / 2 + (Math.random() - 0.5) * 40;
                        const midY = (eff.y1 + eff.y2) / 2 + (Math.random() - 0.5) * 40;
                        ctx.quadraticCurveTo(midX, midY, eff.x2, eff.y2);
                        ctx.stroke();
                        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(eff.x1, eff.y1);
                        ctx.quadraticCurveTo(midX + (Math.random() - 0.5) * 15, midY + (Math.random() - 0.5) * 15, eff.x2,
                            eff.y2);
                        ctx.stroke();
                    } else if (eff.type === 'flame') {
                        if (eff.target && eff.target.alive) {
                            const fx = eff.target.x + eff.target.width / 2 + (Math.random() - 0.5) * 20;
                            const fy = eff.target.y + (Math.random() * eff.target.height);
                            const fgrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, 16);
                            fgrad.addColorStop(0, 'rgba(255,200,50,0.8)');
                            fgrad.addColorStop(0.5, 'rgba(255,100,20,0.5)');
                            fgrad.addColorStop(1, 'rgba(0,0,0,0)');
                            ctx.fillStyle = fgrad;
                            ctx.beginPath();
                            ctx.arc(fx, fy, 16, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
            }

            function drawWeaponSelectHighlight() {
                if (!weaponSelectActive) return;
                // 선택 UI가 캔버스 위에 표시되므로 캔버스에는 타이머만 추가 표시
                const timerSec = Math.ceil(weaponSelectTimer / 60);
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(CANVAS_W / 2 - 40, 20, 80, 30);
                ctx.fillStyle = timerSec <= 5 ? '#ff4444' : '#fff';
                ctx.font = 'bold 20px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(timerSec + 's', CANVAS_W / 2, 42);
                ctx.textAlign = 'start';
            }

            function render() {
                ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
                drawBackground();

                if (gameState === 'playing' || gameState === 'game_over') {
                    drawEffects();
                    drawProjectiles();
                    if (player1 && player1.alive) drawPlayer(player1);
                    if (player2 && player2.alive) drawPlayer(player2);
                    drawParticles();
                    drawWeaponSelectHighlight();

                    // 라운드 종료 메시지
                    if (roundEndDelay > 0 && !roundActive) {
                        ctx.fillStyle = 'rgba(0,0,0,0.5)';
                        ctx.fillRect(0, CANVAS_H / 2 - 40, CANVAS_W, 80);
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 28px "Segoe UI", sans-serif';
                        ctx.textAlign = 'center';
                        const winnerName = (p1Wins > (roundNumber > 0 ? p1Wins - 1 : 0) || (roundNumber === 0 && p1Wins > 0)) ?
                            'PLAYER 1' : 'PLAYER 2';
                        ctx.fillText(`${winnerName} 라운드 승!`, CANVAS_W / 2, CANVAS_H / 2 + 8);
                        ctx.textAlign = 'start';
                    }

                    // 게임 오버 화면 (캔버스 배경)
                    if (gameState === 'game_over') {
                        ctx.fillStyle = 'rgba(0,0,0,0.6)';
                        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                        ctx.fillStyle = '#ffdd57';
                        ctx.font = 'bold 40px "Segoe UI", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('GAME OVER', CANVAS_W / 2, CANVAS_H / 2 - 10);
                        ctx.textAlign = 'start';
                    }
                }
            }

            function gameLoop() {
                update();
                render();
                requestAnimationFrame(gameLoop);
            }

            // ==================== 입력 처리 ====================
            window.addEventListener('keydown', (e) => {
                keys[e.key] = true;
                keys[e.key.toLowerCase()] = true;
                if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                    e.preventDefault();
                }
            });

            window.addEventListener('keyup', (e) => {
                keys[e.key] = false;
                keys[e.key.toLowerCase()] = false;
            });

            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = CANVAS_W / rect.width;
                const scaleY = CANVAS_H / rect.height;
                mouseX = (e.clientX - rect.left) * scaleX;
                mouseY = (e.clientY - rect.top) * scaleY;
            });

            canvas.addEventListener('mousedown', (e) => {
                if (e.button === 0) {
                    mouseDown = true;
                    if (roundActive && gameState === 'playing') {
                        const myPlayer = myPlayerId === 1 ? player1 : player2;
                        if (myPlayer && myPlayer.alive) {
                            const wData = WEAPONS[myPlayer.currentWeapon];
                            if (wData) {
                                fireWeapon(myPlayer, wData);
                                if (!isHost) sendFire(myPlayer.currentWeapon);
                            }
                        }
                    }
                }
            });

            canvas.addEventListener('mouseup', (e) => {
                if (e.button === 0) mouseDown = false;
            });

            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            // 터치 지원
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const scaleX = CANVAS_W / rect.width;
                const scaleY = CANVAS_H / rect.height;
                mouseX = (e.touches[0].clientX - rect.left) * scaleX;
                mouseY = (e.touches[0].clientY - rect.top) * scaleY;
            });

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                mouseDown = true;
                const rect = canvas.getBoundingClientRect();
                const scaleX = CANVAS_W / rect.width;
                const scaleY = CANVAS_H / rect.height;
                mouseX = (e.touches[0].clientX - rect.left) * scaleX;
                mouseY = (e.touches[0].clientY - rect.top) * scaleY;
                if (roundActive && gameState === 'playing') {
                    const myPlayer = myPlayerId === 1 ? player1 : player2;
                    if (myPlayer && myPlayer.alive) {
                        const wData = WEAPONS[myPlayer.currentWeapon];
                        if (wData) {
                            fireWeapon(myPlayer, wData);
                            if (!isHost) sendFire(myPlayer.currentWeapon);
                        }
                    }
                }
            });

            canvas.addEventListener('touchend', () => { mouseDown = false; });

            // ==================== 버튼 이벤트 ====================
            btnHost.addEventListener('click', hostGame);
            btnJoin.addEventListener('click', () => joinGame(inputRoomCode.value.trim()));
            inputRoomCode.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') joinGame(inputRoomCode.value.trim());
            });
            inputRoomCode.addEventListener('input', () => {
                inputRoomCode.value = inputRoomCode.value.replace(/[^0-9a-zA-Z]/g, '').slice(0, 4);
            });

            btnStartGame.addEventListener('click', () => {
                if (isHost && peerConnected) {
                    startMatch();
                    if (conn && conn.open) {
                        conn.send({ type: 'start_game' });
                    }
                }
            });

            btnCancelWait.addEventListener('click', () => {
                if (peer) peer.destroy();
                peer = null;
                conn = null;
                peerConnected = false;
                waitingRoom.classList.remove('visible');
                waitingRoom.style.display = 'none';
                mainMenu.classList.remove('hidden');
                gameState = 'menu';
            });

            btnPlayAgain.addEventListener('click', () => {
                resultScreen.classList.remove('visible');
                resultScreen.style.display = 'none';
                if (isHost) {
                    startMatch();
                    if (conn && conn.open) conn.send({ type: 'start_game' });
                }
            });

            btnBackMenu.addEventListener('click', () => {
                resultScreen.classList.remove('visible');
                resultScreen.style.display = 'none';
                hud.classList.remove('visible');
                hud.style.display = 'none';
                weaponSelect.classList.remove('visible');
                weaponSelect.style.display = 'none';
                if (peer) peer.destroy();
                peer = null;
                conn = null;
                peerConnected = false;
                gameState = 'menu';
                mainMenu.classList.remove('hidden');
                player1 = null;
                player2 = null;
                projectiles = [];
                particles = [];
                effects = [];
                p1Wins = 0;
                p2Wins = 0;
                roundNumber = 0;
                roundActive = false;
                weaponSelectActive = false;
            });

            // ==================== 어드민 패널 ====================
            adminTriggerZone.addEventListener('click', () => {
                if (gameState !== 'playing') return;
                adminClickCount++;
                adminClickTimer = 90;
                if (adminClickCount >= 7) {
                    adminClickCount = 0;
                    adminPanel.classList.toggle('visible');
                    if (adminPanel.classList.contains('visible')) {
                        adminPanel.style.display = 'flex';
                        if (player1) adminHpP1.value = player1.health;
                        if (player2) adminHpP2.value = player2.health;
                    } else {
                        adminPanel.style.display = 'none';
                    }
                }
            });

            adminClose.addEventListener('click', () => {
                adminPanel.classList.remove('visible');
                adminPanel.style.display = 'none';
                adminClickCount = 0;
            });

            adminGodMode.addEventListener('change', () => {
                adminGodModeEnabled = adminGodMode.checked;
            });
            adminOneShot.addEventListener('change', () => {
                adminOneShotEnabled = adminOneShot.checked;
            });
            adminNoCooldown.addEventListener('change', () => {
                adminNoCooldownEnabled = adminNoCooldown.checked;
            });
            adminShowHitboxes.addEventListener('change', () => {
                adminShowHitboxesEnabled = adminShowHitboxes.checked;
            });
            adminResetRound.addEventListener('click', () => {
                if (player1 && player2) {
                    resetRound();
                    if (isHost && conn && conn.open) {
                        conn.send({ type: 'round_start', p1Weapon: player1.currentWeapon, p2Weapon: player2
                                .currentWeapon });
                    }
                }
            });
            adminSkipRound.addEventListener('click', () => {
                if (roundActive && player2) {
                    player2.health = 0;
                    player2.alive = false;
                    player2.onDeath();
                    if (isHost) {
                        endRound(1);
                        if (conn && conn.open) conn.send({ type: 'round_end', winnerId: 1 });
                    }
                }
            });

            // ==================== 반응형 캔버스 크기 조정 ====================
            function resizeCanvas() {
                const wrapperWidth = wrapper.clientWidth;
                const wrapperHeight = wrapper.clientHeight;
                const aspectRatio = CANVAS_W / CANVAS_H;
                let newWidth, newHeight;
                if (wrapperWidth / wrapperHeight > aspectRatio) {
                    newHeight = wrapperHeight;
                    newWidth = newHeight * aspectRatio;
                } else {
                    newWidth = wrapperWidth;
                    newHeight = newWidth / aspectRatio;
                }
                canvas.style.width = newWidth + 'px';
                canvas.style.height = newHeight + 'px';
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // ==================== 초기화 ====================
            canvas.width = CANVAS_W;
            canvas.height = CANVAS_H;
            gameLoop();

            console.log('🎮 2D Rivals 준비 완료!');
            console.log('  - 방 만들기: 4자리 코드 생성');
            console.log('  - 방 참가: 4자리 코드 입력');
            console.log('  - 무기 10종 (라운드 종료 후 선택)');
            console.log('  - 우측 하단 7회 클릭 → 어드민 패널');
            console.log('  - 조작: WASD 이동, 마우스 클릭 공격');
        })();
    </script>
</body>
</html>
