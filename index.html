<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D 멀티플레이어 미로 파괴 탈출 RPG - 찐 최종 인피니티 에디션</title>
    <!-- 외부 라이브러리: PeerJS (P2P 통신용) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* 1. 디자인 시스템 및 테마 정의 */
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #eab308;
            --purple: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 2. 대기실 (Lobby) UI 레이아웃 */
        #lobby-container {
            width: 500px;
            background: var(--panel-bg);
            border: 2px solid var(--accent-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .lobby-title {
            text-align: center;
            font-size: 28px;
            margin-bottom: 25px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: var(--bg-dark);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-bottom: 12px;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #475569;
            color: white;
        }

        .btn-secondary:hover {
            background: #64748b;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            color: var(--text-muted);
            position: relative;
        }

        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #334155;
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            display: none;
            background: rgba(255, 255, 255, 0.05);
        }

        #waiting-room {
            display: none;
        }

        .player-list {
            margin: 20px 0;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }

        .player-item:last-child { border-bottom: none; }
        .player-status { font-weight: bold; }
        .status-ready { color: var(--success-color); }

        /* 3. 인게임 HUD 및 캔버스 레이아웃 */
        #game-container {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            background: #020617;
            display: block;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-family: monospace;
            z-index: 50;
        }

        .hud-panel {
            background: rgba(15, 23, 42, 0.85);
            padding: 12px 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
        }

        .hud-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .hud-value {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        .weapon-rpg { border-left-color: var(--gold); }
        .weapon-rpg .hud-value { color: var(--gold); }
        .weapon-nuke { border-left-color: var(--purple); animation: nuke-pulse 1s infinite alternate; }
        .weapon-nuke .hud-value { color: var(--purple); text-shadow: 0 0 10px rgba(168, 85, 247, 0.6); }

        @keyframes nuke-pulse {
            from { border-left-color: var(--purple); }
            to { border-left-color: var(--danger-color); }
        }

        .level-panel { border-left-color: var(--success-color); }
        .level-panel .hud-value { color: var(--success-color); }

        #crosshair-guide {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.8);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-muted);
            border: 1px solid #334155;
            pointer-events: none;
            z-index: 50;
        }

        #game-notifier {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid var(--gold);
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.3);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
            text-align: center;
        }

        #game-notifier.active { opacity: 1; }

        /* 결과 창 */
        #result-screen {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            z-index: 200;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .result-box {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            border-radius: 16px;
            border: 2px solid var(--success-color);
            background: var(--panel-bg);
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.2);
        }

        .result-title {
            font-size: 42px;
            color: var(--success-color);
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: 900;
        }

        /* 우측 하단 초미세 어드민 버튼 이스터에그 스타일 */
        #secret-admin-trigger {
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 9px;
            color: #020617; /* 완전히 화면 구석 배경색에 매립하여 완벽 은폐 */
            cursor: pointer;
            z-index: 9999;
            opacity: 0.3;
            transition: opacity 0.2s;
        }
        #secret-admin-trigger:hover {
            opacity: 1;
            color: var(--danger-color);
        }
    </style>
</head>
<body>

    <!-- [MODULE 1: LOBBY UI] -->
    <div id="lobby-container">
        <div id="lobby-main">
            <h1 class="lobby-title">Maze Breaker 2D</h1>
            <div class="input-group">
                <label for="nickname-input">플레이어 닉네임</label>
                <input type="text" id="nickname-input" placeholder="닉네임을 입력하세요..." maxlength="10" value="플레이어1">
            </div>
            <button id="btn-create-mode" class="btn">방 만들기 (호스트)</button>
            <div class="divider">또는</div>
            <div class="input-group">
                <label for="room-code-input">참여할 4자리 코드 입력</label>
                <input type="text" id="room-code-input" placeholder="예: 7A9F" maxlength="4" style="text-transform: uppercase;">
            </div>
            <button id="btn-join-mode" class="btn btn-secondary">지정된 방 참여하기</button>
            <div id="lobby-status" class="status-message"></div>
        </div>

        <div id="waiting-room">
            <h1 class="lobby-title">대기실</h1>
            <div style="text-align:center; margin-bottom: 15px;">
                <span style="color: var(--text-muted);">방 코드: </span>
                <span id="display-room-code" style="font-size: 24px; font-weight: bold; color: var(--accent-color); letter-spacing: 2px;">----</span>
            </div>
            <div class="player-list" id="ui-player-list"></div>
            <div id="host-controls" style="display: none;">
                <button id="btn-start-game" class="btn" style="background: var(--success-color); color: #fff;">게임 시작하기</button>
            </div>
            <div id="client-controls" style="display: none; text-align: center; color: var(--gold); padding: 10px; font-style: italic;">
                방장이 게임을 시작하기를 기다리는 중...
            </div>
            <button id="btn-leave-lobby" class="btn btn-secondary" style="margin-top: 10px;">나가기</button>
        </div>
    </div>

    <!-- [MODULE 2: INGAME HUD & CANVAS] -->
    <div id="game-container">
        <div id="hud">
            <div class="hud-panel level-panel">
                <div class="hud-title">현재 스테이지</div>
                <div class="hud-value" id="hud-level">LV. 1 / 10</div>
            </div>
            <div class="hud-panel">
                <div class="hud-title">경고 상태</div>
                <div class="hud-value" id="hud-status" style="color: var(--danger-color);">괴물 추격 구역!</div>
            </div>
            <div class="hud-panel weapon-rpg" id="hud-weapon-panel">
                <div class="hud-title">장착 무기</div>
                <div class="hud-value" id="hud-weapon">맨손 (상자 파괴 가능)</div>
            </div>
            <div class="hud-panel">
                <div class="hud-title">연결 정보</div>
                <div class="hud-value" id="hud-peers" style="font-size:14px;">연결 중..</div>
            </div>
        </div>
        <div id="crosshair-guide">마우스 클릭: 무기 발사 | 우측 하단 구석 어드민 주의</div>
        <div id="game-notifier">럭키 박스를 발견했습니다!</div>
        <canvas id="gameCanvas"></canvas>
        
        <!-- 이스터에그 비밀 어드민 버튼 스위치 -->
        <div id="secret-admin-trigger">어드민</div>
    </div>

    <!-- [MODULE 3: RESULT SCREEN] -->
    <div id="result-screen">
        <div class="result-box">
            <div class="result-title">최종 탈출 성공!</div>
            <div class="result-desc" id="result-text">축하합니다! 괴물들과 초대형 지옥 미로 단계를 전부 박살내고 완벽하게 탈출했습니다!</div>
            <button class="btn" onclick="window.location.reload();">처음으로 돌아가기</button>
        </div>
    </div>

    <!-- [CORE GAME ENGINE SCRIPTS] -->
    <script>
        // --- 글로벌 환경 설정 및 시스템 공간 정의 ---
        const PEER_PREFIX = "MZBRK2D-"; 
        const CELL_SIZE = 48; 
        
        const CELL_PATH = 0;
        const CELL_WALL = 1;
        const CELL_BOX = 2;
        const CELL_EXIT = 3;

        const G = {
            peer: null,
            conn: null,
            isHost: false,
            roomCode: '',
            nickname: '플레이어',
            
            currentLevel: 1,
            maxLevel: 10,
            gridSize: 61, // [요청 반영] 초반 레벨부터 아주아주 큰 초대형 스케일(61x61) 기본 세팅
            
            gameState: 'LOBBY', 
            players: {}, 
            maze: [],    
            projectiles: [], // {x, y, vx, vy, owner, isNuke}
            particles: [],   
            monsters: [],    // 괴물 엔티티 목록 배열: {id, x, y, hp, maxHp, speed}
            
            canvas: null,
            ctx: null,
            camera: { x: 0, y: 0 },
            keys: {},
            mouseX: 0,
            mouseY: 0,
            localId: null,
            monsterIdCounter: 0
        };

        const UI = {
            lobbyWrapper: document.getElementById('lobby-container'),
            lobbyMain: document.getElementById('lobby-main'),
            waitingRoom: document.getElementById('waiting-room'),
            lobbyStatus: document.getElementById('lobby-status'),
            displayRoomCode: document.getElementById('display-room-code'),
            playerList: document.getElementById('ui-player-list'),
            hostControls: document.getElementById('host-controls'),
            clientControls: document.getElementById('client-controls'),
            nicknameInput: document.getElementById('nickname-input'),
            roomCodeInput: document.getElementById('room-code-input'),
            gameContainer: document.getElementById('game-container'),
            resultScreen: document.getElementById('result-screen'),
            notifier: document.getElementById('game-notifier'),
            weaponPanel: document.getElementById('hud-weapon-panel'),
            weaponText: document.getElementById('hud-weapon'),
            
            showStatus(msg, isError = false) {
                this.lobbyStatus.style.display = 'block';
                this.lobbyStatus.style.color = isError ? 'var(--danger-color)' : 'var(--accent-color)';
                this.lobbyStatus.innerText = msg;
            },
            triggerNotification(msg) {
                this.notifier.innerText = msg;
                this.notifier.classList.add('active');
                setTimeout(() => this.notifier.classList.remove('active'), 3500);
            },
            updatePlayerListUI() {
                this.playerList.innerHTML = '';
                Object.keys(G.players).forEach(id => {
                    const p = G.players[id];
                    const div = document.createElement('div');
                    div.className = 'player-item';
                    div.innerHTML = `
                        <span>${p.name} ${p.isHost ? '<span style="color:var(--accent-color)">[방장]</span>':''} ${id===G.localId?'(나)':''}</span>
                        <span class="player-status status-ready">준비완료</span>
                    `;
                    this.playerList.appendChild(div);
                });
            }
        };

        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; 
            let code = '';
            for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        // [요청 반영] 초기 스케일 자체를 초거대화(61)하여 고밀도 가변 가속
        function calculateGridSize(level) {
            return 61 + (level - 1) * 6; 
        }

        // --- P2P 네트워크 트래픽 엔진 모듈 ---
        function initNetwork(asHost, roomCode) {
            G.isHost = asHost;
            G.roomCode = roomCode.toUpperCase();
            G.nickname = UI.nicknameInput.value.trim() || '무명전사';
            G.localId = asHost ? PEER_PREFIX + G.roomCode + "-HOST" : PEER_PREFIX + G.roomCode + "-CLIENT-" + Math.floor(Math.random()*1000);

            UI.showStatus("P2P 중계 플랫폼 동기화 세션 진입 중...");

            G.peer = new Peer(G.localId, { debug: 1 });

            G.peer.on('open', (id) => {
                UI.lobbyMain.style.display = 'none';
                UI.waitingRoom.style.display = 'block';
                UI.displayRoomCode.innerText = G.roomCode;

                G.players[G.localId] = {
                    x: CELL_SIZE * 1.5, y: CELL_SIZE * 1.5,
                    vx: 0, vy: 0, angle: 0,
                    name: G.nickname, hasRPG: false, hasNuke: false, isHost: asHost
                };

                if (asHost) {
                    UI.hostControls.style.display = 'block';
                    UI.updatePlayerListUI();
                    G.gridSize = calculateGridSize(G.currentLevel);
                    generateAdvancedMaze();
                } else {
                    UI.clientControls.style.display = 'block';
                    connectToHost();
                }
            });

            G.peer.on('connection', (connection) => {
                G.conn = connection;
                setupConnectionDataHandler();
            });

            G.peer.on('error', (err) => {
                UI.showStatus("네트워크 에러 재접속 필요: " + err.type, true);
                setTimeout(() => window.location.reload(), 3000);
            });
        }

        function connectToHost() {
            const hostId = PEER_PREFIX + G.roomCode + "-HOST";
            const connection = G.peer.connect(hostId, { reliable: true });
            G.conn = connection;
            
            connection.on('open', () => {
                setupConnectionDataHandler();
                sendData({ type: 'JOIN', name: G.nickname, id: G.localId });
            });
        }

        function setupConnectionDataHandler() {
            document.getElementById('hud-peers').innerText = "통신 회선 활성화";
            
            G.conn.on('data', (data) => {
                switch(data.type) {
                    case 'JOIN':
                        G.players[data.id] = {
                            x: CELL_SIZE * 1.5, y: CELL_SIZE * 1.5,
                            vx: 0, vy: 0, angle: 0,
                            name: data.name, hasRPG: false, hasNuke: false, isHost: false
                        };
                        UI.updatePlayerListUI();
                        sendData({ type: 'LOBBY_SYNC', players: G.players });
                        break;
                        
                    case 'LOBBY_SYNC':
                        G.players = data.players;
                        UI.updatePlayerListUI();
                        break;
                        
                    case 'START_GAME':
                        G.maze = data.maze;
                        G.players = data.players;
                        G.currentLevel = data.currentLevel;
                        G.gridSize = data.gridSize;
                        G.monsters = data.monsters; 
                        G.gameState = 'PLAYING';
                        document.getElementById('hud-level').innerText = `LV. ${G.currentLevel} / ${G.maxLevel}`;
                        startGameLoop();
                        break;
                        
                    case 'SYNC_INPUT':
                        if (G.players[data.id]) {
                            G.players[data.id].x = data.x;
                            G.players[data.id].y = data.y;
                            G.players[data.id].angle = data.angle;
                            G.players[data.id].hasRPG = data.hasRPG;
                            G.players[data.id].hasNuke = data.hasNuke;
                        }
                        break;
                        
                    case 'BOX_DESTROYED':
                        G.maze[data.my][data.mx] = CELL_PATH;
                        if(G.players[data.playerId]) G.players[data.playerId].hasRPG = true;
                        createWallDestroyParticles(data.mx * CELL_SIZE + CELL_SIZE/2, data.my * CELL_SIZE + CELL_SIZE/2, '#eab308');
                        UI.triggerNotification(`${G.players[data.playerId].name}님이 상자에서 RPG-7 획득!`);
                        break;
                        
                    case 'FIRE_PROJECTILE':
                        G.projectiles.push({
                            x: data.x, y: data.y, vx: data.vx, vy: data.vy, owner: data.owner, isNuke: data.isNuke
                        });
                        break;
                        
                    case 'MAZE_BREAK':
                        data.tiles.forEach(t => {
                            if(G.maze[t.y] && (G.maze[t.y][t.x] === CELL_WALL || G.maze[t.y][t.x] === CELL_BOX)) {
                                G.maze[t.y][t.x] = CELL_PATH;
                                createWallDestroyParticles(t.x * CELL_SIZE + CELL_SIZE/2, t.y * CELL_SIZE + CELL_SIZE/2, '#475569');
                            }
                        });
                        break;

                    case 'MONSTER_SYNC_FROM_HOST':
                        G.monsters = data.monsters;
                        break;

                    case 'MONSTER_HIT_EXPLOSION':
                        createWallDestroyParticles(data.mx, data.my, '#a855f7');
                        break;

                    case 'LEVEL_UP_SYNC':
                        G.currentLevel = data.currentLevel;
                        G.gridSize = data.gridSize;
                        G.maze = data.maze;
                        G.monsters = data.monsters;
                        G.projectiles = [];
                        Object.keys(G.players).forEach(id => {
                            G.players[id].x = CELL_SIZE * 1.5;
                            G.players[id].y = CELL_SIZE * 1.5;
                        });
                        document.getElementById('hud-level').innerText = `LV. ${G.currentLevel} / ${G.maxLevel}`;
                        UI.triggerNotification(`STAGE ${G.currentLevel} 진입! 미로가 한층 더 거대화됩니다.`);
                        break;

                    case 'GAME_CLEAR':
                        G.gameState = 'END';
                        UI.gameContainer.style.display = 'none';
                        UI.resultScreen.style.display = 'flex';
                        break;
                }
            });
        }

        function sendData(obj) {
            if (G.conn && G.conn.open) G.conn.send(obj);
        }

        // --- 다이내믹 가변 복잡 미로 및 실시간 괴물 생성 엔진 ---
        function generateAdvancedMaze() {
            G.maze = [];
            for (let y = 0; y < G.gridSize; y++) {
                G.maze[y] = [];
                for (let x = 0; x < G.gridSize; x++) G.maze[y][x] = CELL_WALL;
            }

            const stack = [];
            G.maze[1][1] = CELL_PATH;
            stack.push({ x: 1, y: 1 });

            while (stack.length > 0) {
                const current = stack[stack.length - 1];
                const neighbors = [];
                const dirs = [{x:0, y:-2}, {x:0, y:2}, {x:-2, y:0}, {x:2, y:0}];

                dirs.forEach(d => {
                    const nx = current.x + d.x;
                    const ny = current.y + d.y;
                    if (nx > 0 && nx < G.gridSize - 1 && ny > 0 && ny < G.gridSize - 1) {
                        if (G.maze[ny][nx] === CELL_WALL) neighbors.push({ x: nx, y: ny, dir: d });
                    }
                });

                if (neighbors.length > 0) {
                    const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    G.maze[current.y + next.dir.y / 2][current.x + next.dir.x / 2] = CELL_PATH;
                    G.maze[next.y][next.x] = CELL_PATH;
                    stack.push({ x: next.x, y: next.y });
                } else {
                    stack.pop();
                }
            }

            G.maze[G.gridSize - 2][G.gridSize - 2] = CELL_EXIT;

            // 추가 연결 통로 개방 가속 (초대형 맵에 맞춰 루프 가중치 증폭)
            for (let i = 0; i < G.gridSize * 5; i++) {
                let rx = Math.floor(Math.random() * (G.gridSize - 2)) + 1;
                let ry = Math.floor(Math.random() * (G.gridSize - 2)) + 1;
                if(G.maze[ry][rx] === CELL_WALL && ry !== G.gridSize-2 && rx !== G.gridSize-2) G.maze[ry][rx] = CELL_PATH;
            }

            // 럭키박스 무작위 스폰 레이아웃 구성
            let boxCount = 0;
            let targetBoxMax = 30 + G.currentLevel * 15; // 초대형 맵 크기에 비례하여 럭키박스 개수 상향
            while(boxCount < targetBoxMax) {
                let bx = Math.floor(Math.random() * (G.gridSize - 2)) + 1;
                let by = Math.floor(Math.random() * (G.gridSize - 2)) + 1;
                if (G.maze[by][bx] === CELL_PATH && (bx > 3 || by > 3) && G.maze[by][bx] !== CELL_EXIT) {
                    G.maze[by][bx] = CELL_BOX;
                    boxCount++;
                }
            }

            // 괴물 엔티티 대량 스폰 제어
            G.monsters = [];
            let spawnMonsterCount = 8 + G.currentLevel * 3; // 넓어진 맵 크기에 맞게 괴물 배치 밀도 최적화
            for(let m=0; m<spawnMonsterCount; m++) {
                let mx = Math.floor(Math.random() * (G.gridSize - 4)) + 3;
                let my = Math.floor(Math.random() * (G.gridSize - 4)) + 3;
                if(G.maze[my][mx] === CELL_PATH) {
                    G.monsters.push({
                        id: ++G.monsterIdCounter,
                        x: mx * CELL_SIZE + CELL_SIZE/2,
                        y: my * CELL_SIZE + CELL_SIZE/2,
                        hp: 25 + G.currentLevel * 15,    
                        maxHp: 25 + G.currentLevel * 15,
                        speed: 1.6 + (G.currentLevel * 0.12) 
                    });
                }
            }
        }

        // --- GAME REALTIME ENGINE CONTROLLER ---
        function startGameLoop() {
            UI.lobbyWrapper.style.display = 'none';
            UI.gameContainer.style.display = 'block';
            
            G.canvas = document.getElementById('gameCanvas');
            G.ctx = G.canvas.getContext('2d');
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            window.onkeydown = (e) => { G.keys[e.key.toLowerCase()] = true; };
            window.onkeyup = (e) => { G.keys[e.key.toLowerCase()] = false; };
            
            G.canvas.onmousemove = (e) => {
                const rect = G.canvas.getBoundingClientRect();
                G.mouseX = e.clientX - rect.left;
                G.mouseY = e.clientY - rect.top;
            };

            G.canvas.onmousedown = (e) => { if (e.button === 0) fireEquippedWeapon(); };

            // 비밀 치트 어드민 버튼 리스너 연계
            document.getElementById('secret-admin-trigger').onclick = (e) => {
                e.stopPropagation();
                const me = G.players[G.localId];
                if(me) {
                    me.hasNuke = true;
                    me.hasRPG = false;
                    UI.weaponPanel.className = "hud-panel weapon-nuke";
                    UI.weaponText.innerText = "🚨 초강력 핵미사일 (ADMIN)";
                    UI.triggerNotification("어드민 치트 활성화! 화면 전체를 멸살하는 핵미사일이 장전되었습니다!");
                }
            };

            requestAnimationFrame(updateFrame);
        }

        function resizeCanvas() {
            if (G.canvas) {
                G.canvas.width = window.innerWidth;
                G.canvas.height = window.innerHeight;
            }
        }

        // --- WEAPON LOGIC SYSTEM (RPG & NUKE) ---
        function fireEquippedWeapon() {
            const me = G.players[G.localId];
            if (!me || G.gameState !== 'PLAYING') return;

            const worldMouseX = G.mouseX + G.camera.x;
            const worldMouseY = G.mouseY + G.camera.y;

            if (me.hasRPG || me.hasNuke) {
                const dx = worldMouseX - me.x;
                const dy = worldMouseY - me.y;
                const dist = Math.hypot(dx, dy);
                if (dist === 0) return;

                const bulletSpeed = me.hasNuke ? 10 : 15; 
                const projData = {
                    type: 'FIRE_PROJECTILE',
                    x: me.x, y: me.y,
                    vx: (dx / dist) * bulletSpeed,
                    vy: (dy / dist) * bulletSpeed,
                    owner: G.localId,
                    isNuke: me.hasNuke
                };
                
                G.projectiles.push({
                    x: projData.x, y: projData.y, vx: projData.vx, vy: projData.vy, owner: projData.owner, isNuke: projData.isNuke
                });
                sendData(projData);
            } else {
                // 맨손 타격 검정
                const mx = Math.floor(worldMouseX / CELL_SIZE);
                const my = Math.floor(worldMouseY / CELL_SIZE);

                if (mx >= 0 && mx < G.gridSize && my >= 0 && my < G.gridSize) {
                    if (G.maze[by = my][bx = mx] === CELL_BOX) {
                        const distance = Math.hypot(me.x - (mx * CELL_SIZE + CELL_SIZE/2), me.y - (my * CELL_SIZE + CELL_SIZE/2));
                        if (distance < CELL_SIZE * 1.8) {
                            G.maze[my][mx] = CELL_PATH;
                            me.hasRPG = true;
                            UI.weaponPanel.className = "hud-panel weapon-rpg";
                            UI.weaponText.innerText = "🚀 RPG-7 바주카 (무한)";
                            
                            createWallDestroyParticles(mx * CELL_SIZE + CELL_SIZE/2, my * CELL_SIZE + CELL_SIZE/2, '#eab308');
                            UI.triggerNotification("상자를 부수고 무한 RPG-7을 획득했습니다!");

                            sendData({ type: 'BOX_DESTROYED', mx: mx, my: my, playerId: G.localId });
                        }
                    }
                }
            }
        }

        // --- PHYSICAL ENGINE & INTERACTION DETECT ---
        function movePlayerWithCollision(p, vx, vy) {
            const radius = 14; 
            let nextX = p.x + vx;
            let nextY = p.y + vy;

            if (checkMapObstacleCollision(nextX, p.y, radius)) {
                if (vx > 0) nextX = Math.floor((nextX + radius) / CELL_SIZE) * CELL_SIZE - radius - 0.1;
                else if (vx < 0) nextX = Math.floor((nextX - radius) / CELL_SIZE) * CELL_SIZE + CELL_SIZE + radius + 0.1;
            }
            p.x = nextX;

            if (checkMapObstacleCollision(p.x, nextY, radius)) {
                if (vy > 0) nextY = Math.floor((nextY + radius) / CELL_SIZE) * CELL_SIZE - radius - 0.1;
                else if (vy < 0) nextY = Math.floor((nextY - radius) / CELL_SIZE) * CELL_SIZE + CELL_SIZE + radius + 0.1;
            }
            p.y = nextY;
        }

        function checkMapObstacleCollision(x, y, r) {
            const checkPoints = [
                {x: x - r, y: y - r}, {x: x + r, y: y - r},
                {x: x - r, y: y + r}, {x: x + r, y: y + r}
            ];
            for (let i = 0; i < checkPoints.length; i++) {
                const mx = Math.floor(checkPoints[i].x / CELL_SIZE);
                const my = Math.floor(checkPoints[i].y / CELL_SIZE);
                if (mx < 0 || mx >= G.gridSize || my < 0 || my >= G.gridSize) return true;
                
                const tile = G.maze[my][mx];
                if (tile === CELL_WALL || tile === CELL_BOX) return true;
            }
            return false;
        }

        function updateProjectiles() {
            for (let i = G.projectiles.length - 1; i >= 0; i--) {
                const p = G.projectiles[i];
                p.x += p.vx;
                p.y += p.vy;

                const mx = Math.floor(p.x / CELL_SIZE);
                const my = Math.floor(p.y / CELL_SIZE);

                if (mx < 0 || mx >= G.gridSize || my < 0 || my >= G.gridSize) {
                    G.projectiles.splice(i, 1);
                    continue;
                }

                // 벽 충돌 시 폭발 발동
                if (G.maze[my][mx] === CELL_WALL || G.maze[my][mx] === CELL_BOX) {
                    triggerExplosionImpact(mx, my, p.isNuke);
                    G.projectiles.splice(i, 1);
                    continue;
                }

                // 괴물 피격 체크
                for (let m = G.monsters.length - 1; m >= 0; m--) {
                    let mon = G.monsters[m];
                    if(Math.hypot(p.x - mon.x, p.y - mon.y) < 22) {
                        let damage = p.isNuke ? 9999 : 35; 
                        mon.hp -= damage;
                        
                        sendData({ type: 'MONSTER_HIT_EXPLOSION', mx: mon.x, my: mon.y });

                        if(mon.hp <= 0) {
                            createWallDestroyParticles(mon.x, mon.y, '#ef4444');
                            G.monsters.splice(m, 1);
                        }
                        
                        triggerExplosionImpact(mx, my, p.isNuke);
                        G.projectiles.splice(i, 1);
                        break;
                    }
                }
            }
        }

        // --- 무기 타입별 폭발 스케일 분기 연산 ---
        function triggerExplosionImpact(targetMx, targetMy, isNuke) {
            const destroyedTiles = [];
            
            // [요청 반영] RPG 폭발 반경 축소(1칸 이내, 3x3 범위) / 핵폭탄은 12칸 대범위 유지
            const radiusRange = isNuke ? 12 : 1; 
            const particleColor = isNuke ? '#a855f7' : '#f97316';

            for (let dy = -radiusRange; dy <= radiusRange; dy++) {
                for (let dx = -radiusRange; dx <= radiusRange; dx++) {
                    const cx = targetMx + dx;
                    const cy = targetMy + dy;

                    if (cx > 0 && cx < G.gridSize - 1 && cy > 0 && cy < G.gridSize - 1) {
                        if(isNuke && Math.hypot(dx, dy) > radiusRange) continue;

                        const block = G.maze[cy][cx];
                        if (block === CELL_WALL || block === CELL_BOX) {
                            G.maze[cy][cx] = CELL_PATH;
                            destroyedTiles.push({ x: cx, y: cy });
                            createWallDestroyParticles(cx * CELL_SIZE + CELL_SIZE/2, cy * CELL_SIZE + CELL_SIZE/2, '#475569');
                        }
                    }
                }
            }

            // 전술 핵폭탄 범위 내 괴물 멸살 연산
            if (isNuke) {
                const targetWorldX = targetMx * CELL_SIZE + CELL_SIZE/2;
                const targetWorldY = targetMy * CELL_SIZE + CELL_SIZE/2;
                for (let m = G.monsters.length - 1; m >= 0; m--) {
                    let mon = G.monsters[m];
                    if (Math.hypot(mon.x - targetWorldX, mon.y - targetWorldY) < radiusRange * CELL_SIZE) {
                        G.monsters.splice(m, 1);
                    }
                }
            }

            // 폭발 비주얼 파티클 연산
            const loopMax = isNuke ? 90 : 12;
            for (let k = 0; k < loopMax; k++) {
                G.particles.push({
                    x: targetMx * CELL_SIZE + CELL_SIZE/2,
                    y: targetMy * CELL_SIZE + CELL_SIZE/2,
                    vx: (Math.random() - 0.5) * (isNuke ? 26 : 8),
                    vy: (Math.random() - 0.5) * (isNuke ? 26 : 8),
                    radius: Math.random() * (isNuke ? 15 : 4) + 3,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.01,
                    color: particleColor
                });
            }

            sendData({ type: 'MAZE_BREAK', tiles: destroyedTiles });
        }

        // --- 호스트 전용 최적화 추격 인공지능 괴물 시뮬레이터 ---
        function updateMonstersAI() {
            if (!G.isHost || G.monsters.length === 0) return;

            G.monsters.forEach(mon => {
                let closestPlayer = null;
                let minDist = 999999;

                Object.keys(G.players).forEach(id => {
                    let p = G.players[id];
                    let dist = Math.hypot(p.x - mon.x, p.y - mon.y);
                    if(dist < minDist) {
                        minDist = dist;
                        closestPlayer = p;
                    }
                });

                if (closestPlayer) {
                    let dx = closestPlayer.x - mon.x;
                    let dy = closestPlayer.y - mon.y;
                    let angle = Math.atan2(dy, dx);
                    
                    let vx = Math.cos(angle) * mon.speed;
                    let vy = Math.sin(angle) * mon.speed;

                    let nextX = mon.x + vx;
                    let nextY = mon.y + vy;
                    let mRad = 15;

                    if (!checkMapObstacleCollision(nextX, mon.y, mRad)) mon.x = nextX;
                    if (!checkMapObstacleCollision(mon.x, nextY, mRad)) mon.y = nextY;
                }
            });

            sendData({
                type: 'MONSTER_SYNC_FROM_HOST',
                monsters: G.monsters
            });
        }

        function createWallDestroyParticles(px, py, color) {
            for (let i = 0; i < 5; i++) {
                G.particles.push({
                    x: px, y: py,
                    vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
                    radius: Math.random() * 3 + 2, alpha: 1, decay: Math.random() * 0.06 + 0.04, color: color
                });
            }
        }

        function updateParticles() {
            for (let i = G.particles.length - 1; i >= 0; i--) {
                const p = G.particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
                if (p.alpha <= 0) G.particles.splice(i, 1);
            }
        }

        // --- REALTIME CANVAS RENDERING & GAME LOOP ---
        function updateFrame() {
            if (G.gameState !== 'PLAYING') return;

            const me = G.players[G.localId];
            if (me) {
                let pSpeed = 4;
                let vx = 0; let vy = 0;

                if (G.keys['w'] || G.keys['arrowup']) vy = -pSpeed;
                if (G.keys['s'] || G.keys['arrowdown']) vy = pSpeed;
                if (G.keys['a'] || G.keys['arrowleft']) vx = -pSpeed;
                if (G.keys['d'] || G.keys['arrowright']) vx = pSpeed;

                if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; }
                if (vx !== 0 || vy !== 0) movePlayerWithCollision(me, vx, vy);

                me.angle = Math.atan2((G.mouseY + G.camera.y) - me.y, (G.mouseX + G.camera.x) - me.x);

                sendData({
                    type: 'SYNC_INPUT', id: G.localId, x: me.x, y: me.y, angle: me.angle, hasRPG: me.hasRPG, hasNuke: me.hasNuke
                });

                // 괴물 접촉 시 스타트 구역 리스폰 패널티 연산
                G.monsters.forEach(mon => {
                    if(Math.hypot(me.x - mon.x, me.y - mon.y) < 25) {
                        me.x = CELL_SIZE * 1.5;
                        me.y = CELL_SIZE * 1.5; 
                        UI.triggerNotification("☠️ 괴물에게 잡혔습니다! 입구로 패널티 소환됩니다.");
                    }
                });

                // 탈출 지점 포탈 충돌 연산
                const cx = Math.floor(me.x / CELL_SIZE);
                const cy = Math.floor(me.y / CELL_SIZE);
                if (G.maze[cy] && G.maze[cy][cx] === CELL_EXIT) {
                    if (G.currentLevel < G.maxLevel) {
                        G.currentLevel++;
                        G.gridSize = calculateGridSize(G.currentLevel);
                        generateAdvancedMaze();
                        
                        Object.keys(G.players).forEach(id => {
                            G.players[id].x = CELL_SIZE * 1.5;
                            G.players[id].y = CELL_SIZE * 1.5;
                        });
                        G.projectiles = [];

                        document.getElementById('hud-level').innerText = `LV. ${G.currentLevel} / ${G.maxLevel}`;
                        UI.triggerNotification(`STAGE ${G.currentLevel} 진입! 미로 규모가 상향 확장됩니다.`);
                        
                        sendData({
                            type: 'LEVEL_UP_SYNC', currentLevel: G.currentLevel, gridSize: G.gridSize, maze: G.maze, monsters: G.monsters
                        });
                    } else {
                        G.gameState = 'END';
                        UI.gameContainer.style.display = 'none';
                        UI.resultScreen.style.display = 'flex';
                        sendData({ type: 'GAME_CLEAR' });
                    }
                }
            }

            if(G.isHost) updateMonstersAI();

            updateProjectiles();
            updateParticles();

            if (me) {
                G.camera.x = me.x - G.canvas.width / 2;
                G.camera.y = me.y - G.canvas.height / 2;
            }

            G.ctx.fillStyle = '#020617';
            G.ctx.fillRect(0, 0, G.canvas.width, G.canvas.height);

            G.ctx.save();
            G.ctx.translate(-G.camera.x, -G.camera.y);

            // 고성능 뷰포트 컬링 최적화 렌더링 루프 가동
            const startX = Math.max(0, Math.floor(G.camera.x / CELL_SIZE));
            const endX = Math.min(G.gridSize, Math.ceil((G.camera.x + G.canvas.width) / CELL_SIZE));
            const startY = Math.max(0, Math.floor(G.camera.y / CELL_SIZE));
            const endY = Math.min(G.gridSize, Math.ceil((G.camera.y + G.canvas.height) / CELL_SIZE));

            for (let y = startY; y < endY; y++) {
                for (let x = startX; x < endX; x++) {
                    const blockType = G.maze[y][x];
                    const px = x * CELL_SIZE; const py = y * CELL_SIZE;

                    if (blockType === CELL_WALL) {
                        G.ctx.fillStyle = '#1e293b'; G.ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);
                        G.ctx.strokeStyle = '#334155'; G.ctx.lineWidth = 1; G.ctx.strokeRect(px, py, CELL_SIZE, CELL_SIZE);
                        G.ctx.fillStyle = '#0f172a'; G.ctx.fillRect(px + 4, py + 4, CELL_SIZE - 8, CELL_SIZE - 8);
                    } else if (blockType === CELL_BOX) {
                        G.ctx.fillStyle = '#b45309'; G.ctx.fillRect(px + 4, py + 4, CELL_SIZE - 8, CELL_SIZE - 8);
                        G.ctx.strokeStyle = '#eab308'; G.ctx.lineWidth = 2;
                        G.ctx.beginPath(); G.ctx.moveTo(px+8, py+8); G.ctx.lineTo(px+CELL_SIZE-8, py+CELL_SIZE-8);
                        G.ctx.moveTo(px+CELL_SIZE-8, py+8); G.ctx.lineTo(px+8, py+CELL_SIZE-8); G.ctx.stroke();
                    } else if (blockType === CELL_EXIT) {
                        G.ctx.fillStyle = 'rgba(34, 197, 94, 0.2)'; G.ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);
                        G.ctx.strokeStyle = 'var(--success-color)'; G.ctx.lineWidth = 4; G.ctx.strokeRect(px+2, py+2, CELL_SIZE-4, CELL_SIZE-4);
                        G.ctx.fillStyle = 'var(--success-color)'; G.ctx.font = 'bold 11px Arial'; G.ctx.textAlign = 'center';
                        G.ctx.fillText(G.currentLevel === 10 ? "PORTAL" : "NEXT", px + CELL_SIZE/2, py + CELL_SIZE/2 + 4);
                    }
                }
            }

            // 실시간 촉수 눈알 괴물 그래픽 드로잉
            G.monsters.forEach(mon => {
                G.ctx.save();
                G.ctx.translate(mon.x, mon.y);

                G.ctx.fillStyle = '#ef4444';
                G.ctx.beginPath();
                G.ctx.arc(0, 0, 18, 0, Math.PI*2);
                G.ctx.fill();

                // 악성 눈동자 렌더링
                G.ctx.fillStyle = '#fff';
                G.ctx.beginPath(); G.ctx.arc(3, 0, 7, 0, Math.PI*2); G.ctx.fill();
                G.ctx.fillStyle = '#7c3aed';
                G.ctx.beginPath(); G.ctx.arc(5, 0, 3, 0, Math.PI*2); G.ctx.fill();

                G.ctx.restore();
                
                // 괴물 체력 게이지 바 출력
                G.ctx.fillStyle = 'rgba(0,0,0,0.6)';
                G.ctx.fillRect(mon.x - 20, mon.y - 28, 40, 4);
                G.ctx.fillStyle = 'var(--danger-color)';
                G.ctx.fillRect(mon.x - 20, mon.y - 28, (mon.hp / mon.maxHp) * 40, 4);
            });

            // 투사체 처리
            G.projectiles.forEach(p => {
                G.ctx.fillStyle = p.isNuke ? '#c084fc' : '#ef4444';
                G.ctx.beginPath();
                G.ctx.arc(p.x, p.y, p.isNuke ? 10 : 5, 0, Math.PI * 2);
                G.ctx.fill();
            });

            // 폭발 파티클 루프
            G.particles.forEach(p => {
                G.ctx.save(); G.ctx.globalAlpha = p.alpha; G.ctx.fillStyle = p.color;
                G.ctx.beginPath(); G.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); G.ctx.fill();
                G.ctx.restore();
            });

            // 동기화 멀티플레이어 유저 그래픽 구현
            Object.keys(G.players).forEach(id => {
                const player = G.players[id];
                G.ctx.save(); G.ctx.translate(player.x, player.y); G.ctx.rotate(player.angle);

                G.ctx.fillStyle = player.isHost ? 'var(--accent-color)' : '#ec4899';
                G.ctx.beginPath(); G.ctx.arc(0, 0, 16, 0, Math.PI * 2); G.ctx.fill();
                G.ctx.strokeStyle = '#fff'; G.ctx.lineWidth = 2; G.ctx.stroke();

                if (player.hasNuke) {
                    G.ctx.fillStyle = '#c084fc'; G.ctx.fillRect(4, -6, 26, 12);
                    G.ctx.fillStyle = '#eab308'; G.ctx.fillRect(24, -8, 6, 16);
                } else if (player.hasRPG) {
                    G.ctx.fillStyle = '#eab308'; G.ctx.fillRect(4, -4, 22, 8);
                }

                G.ctx.restore();
                G.ctx.fillStyle = '#fff'; G.ctx.font = '12px Arial'; G.ctx.textAlign = 'center';
                G.ctx.fillText(player.name, player.x, player.y - 24);
            });

            G.ctx.restore();
            requestAnimationFrame(updateFrame);
        }

        // --- INITIALIZATION ENTRY POINT ---
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-create-mode').addEventListener('click', () => {
                initNetwork(true, generateRoomCode());
            });

            document.getElementById('btn-join-mode').addEventListener('click', () => {
                const codeInput = document.getElementById('room-code-input').value.trim().toUpperCase();
                if (codeInput.length === 4) initNetwork(false, codeInput);
                else alert("올바른 4자리 코드를 입력하세요.");
            });

            document.getElementById('btn-leave-lobby').addEventListener('click', () => { window.location.reload(); });

            document.getElementById('btn-start-game').addEventListener('click', () => {
                if (!G.isHost) return;
                G.gameState = 'PLAYING';
                sendData({
                    type: 'START_GAME', maze: G.maze, players: G.players, currentLevel: G.currentLevel, gridSize: G.gridSize, monsters: G.monsters
                });
                startGameLoop();
            });
        });
    </script>
</body>
</html>
